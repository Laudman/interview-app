import org.springframework.boot.gradle.plugin.SpringBootPlugin

buildscript {
    ext {
        springBootVersion = '3.4.1'
        mapstructVersion = '1.5.5.Final'
        openapiVersion = '2.5.0'
        lombokVersion = '1.18.32'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "1.1.7"
    id 'org.openapi.generator' version '7.6.0'
    id 'io.freefair.lombok' version '8.6'
}

allprojects {
    group = 'com.interview.fda'
    sourceCompatibility = JavaVersion.VERSION_17

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.openapi.generator'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.boot:spring-boot-starter-parent:${springBootVersion}"
        }
    }

    dependencies {
        compileOnly(
                "org.projectlombok:lombok-mapstruct-binding:0.2.0",
                "org.projectlombok:lombok:${lombokVersion}"
        )
        implementation(
                "org.springframework.boot:spring-boot-starter:${springBootVersion}",
                "org.springframework.boot:spring-boot-starter-web:${springBootVersion}",
                "org.springframework.boot:spring-boot-starter-validation:${springBootVersion}",
                "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}",
                "org.mapstruct:mapstruct:${mapstructVersion}",
                'org.projectlombok:lombok',

                // needed to remove vulnerabilities
                'org.apache.commons:commons-compress:1.27.1',
                'ch.qos.logback:logback-core:1.5.16',
                'ch.qos.logback:logback-classic:1.5.16'
        )
        annotationProcessor(
                'org.projectlombok:lombok-mapstruct-binding:0.2.0',
                "org.projectlombok:lombok:${lombokVersion}",
                "org.mapstruct:mapstruct-processor:${mapstructVersion}"

        )
        testAnnotationProcessor(
                'org.projectlombok:lombok-mapstruct-binding:0.2.0',
                "org.projectlombok:lombok:${lombokVersion}",
                "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        )

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    bootJar {
        mainClass = 'com.interview.fda.InterviewApplication'
    }
}
dependencies {
    api project(':domain')
    api project(':infrastructure') {
        dependencies {
            api project(':domain')
        }
    }
}

wrapper {
    gradleVersion = "8.4"
    distributionType = Wrapper.DistributionType.ALL
}